:'03 / ЛИПСВАЩИЯТ АРХИВ',c3title:'НЕВЪЗМОЖНИЯТ ВРЕМЕВИ ПЕЧАТ',c3text:'Оцелели са три записа. Само един може да е оригиналното предаване от бъдещето. Открий записа с дата един ден след активирането.',recordA:'АРХИВ A / Вчера / 03:17',recordB:'АРХИВ B / Утре / 03:17',recordC:'АРХИВ C / Днес / 03:17',c3wrong:'Този запис не е от бъдещето. Опитай пак.',c3right:'Оригиналният сигнал е потвърден. Изпратен е от бъдеща версия на мрежата UNKNOWN.',chapter4:'04 / ГРАДСКИ ПРОТОКОЛ',c4title:'НЕ СИ САМ',c4text:'Твоят артефакт е един от няколко фрагмента. Избери град за симулирана групова мисия. Не събираме GPS или лично местоположение.',cityPrompt:'ГРАД / СЕКТОР',cityStart:'ОТВОРИ ГРАДСКАТА МИСИЯ',cityMission:'ГРАДСКИ АРХИВ / ДЕМО ЗА СЪТРУДНИЧЕСТВО',cityBody:'В реална версия играчите от един град ще получават различни улики. За това демо трима симулирани агенти са предоставили своите фрагменти. Обедини ги в правилния ред.',fragment1:'АГЕНТ A / 03',fragment2:'АГЕНТ B / 17',fragment3:'АГЕНТ C / РЕД: A → B',cityHint:'Въведи четирицифрения код, образуван от агентите A и B.',cityUnlock:'ОТКЛЮЧИ ГРАДСКИЯ АРХИВ',cityWrong:'Грешно възстановяване. Провери реда на фрагментите.',cityRight:'ГРАДСКИЯТ АРХИВ Е ВЪЗСТАНОВЕН',endTitle:'ПЪРВИЯТ СИГНАЛ БЕШЕ ПРЕДУПРЕЖДЕНИЕ.',endText:'Сигналът не е изпратен, за да предотврати бъдещето. Изпратен е, за да открие хората, които могат да го променят. Артефактът ти е регистриран в мрежата.',endNext:'АРТЕФАКТ 002 / ОЧАКВА СЕ СИГНАЛ',endNote:'КРАЙ НА ИГРАЕМОТО ДЕМО. Търговската версия ще има по-сложни загадки, множество финали, реални градски мисии и проверени преводи.',replay:'ИГРАЙ ОТНАЧАЛО',branchSend:'Ти изпрати сигнала. Друг артефакт отговори.',branchDestroy:'Ти унищожи сигнала. Резервното му копие оцеля в градския архив.'}}
